<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>All-in-One Retro MIDI Player</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <style>
    :root {
      --bg-color: #111;
      --panel-bg: #000;
      --text-color: #0f0;
      --border-color: #0f0;
      --accent-color: #0f0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      transition: all 0.3s ease;
    }

    /* テーマ定義 */
    body.theme-8bit {
      --bg-color: #111; --panel-bg: #000; --text-color: #0f0; --border-color: #0f0; --accent-color: #0f0;
      font-family: 'Courier New', monospace;
    }
    body.theme-ms {
      --bg-color: #008080; --panel-bg: #c0c0c0; --text-color: #000; --border-color: #808080; --accent-color: navy;
      font-family: 'Tahoma', sans-serif;
    }
    body.theme-xg {
      --bg-color: #1a1a24; --panel-bg: #0d1117; --text-color: #00d0ff; --border-color: #00d0ff; --accent-color: #00d0ff;
      font-family: 'Arial', sans-serif;
    }
    body.theme-sc88 {
      --bg-color: #222; --panel-bg: #333; --text-color: #00ff66; --border-color: #111; --accent-color: #00ff66;
      font-family: 'Segoe UI', sans-serif;
    }

    .main-container {
      background: var(--panel-bg);
      border: 4px solid var(--border-color);
      padding: 20px;
      width: 480px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      border-radius: 8px;
    }

    /* タブ切り替え */
    .tab-group {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      background: rgba(255,255,255,0.1);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    .tab-btn.active {
      background: var(--accent-color);
      color: #000;
    }

    /* 共通表示領域 */
    .display-panel {
      background: rgba(0,0,0,0.5);
      border: 2px inset var(--border-color);
      padding: 10px;
      margin-bottom: 15px;
    }
    .status-text {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* SC-88用16chメーター */
    .meters {
      display: flex;
      gap: 3px;
      height: 40px;
      align-items: flex-end;
      margin-top: 8px;
    }
    .meter-bar { flex: 1; background: rgba(255,255,255,0.05); height: 100%; display: flex; align-items: flex-end; }
    .meter-fill { width: 100%; background: var(--accent-color); height: 0%; transition: height 0.05s ease; }

    /* コントロール群 */
    .controls-row { display: flex; gap: 8px; margin: 10px 0; }
    button.ctrl-btn {
      background: rgba(255,255,255,0.1);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      padding: 8px;
      cursor: pointer;
      font-weight: bold;
      flex: 1;
    }
    button.ctrl-btn:hover:not(:disabled) { background: var(--accent-color); color: #000; }
    button.ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .file-input-label {
      display: block;
      text-align: center;
      border: 2px dashed var(--border-color);
      padding: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      font-size: 12px;
    }
    input[type="file"] { display: none; }

    .seek-area, .vol-area { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-top: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent-color); cursor: pointer; }
  </style>
</head>
<body class="theme-8bit">

<div class="main-container">
  <!-- モード選択タブ -->
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTheme('8bit')">8-BIT</button>
    <button class="tab-btn" onclick="switchTheme('ms')">MS GS</button>
    <button class="tab-btn" onclick="switchTheme('xg')">YAMAHA XG</button>
    <button class="tab-btn" onclick="switchTheme('sc88')">ROLAND SC-88</button>
  </div>

  <label class="file-input-label">
    [ SELECT MIDI FILE ]
    <input type="file" id="fileInput" accept=".mid,.midi">
  </label>

  <!-- 共通ディスプレイ -->
  <div class="display-panel">
    <div class="status-text" id="statusText">SYSTEM READY</div>
    <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;">
      <span>TIME:</span>
      <span id="timeDisplay">00:00 / 00:00</span>
    </div>
    <!-- SC-88用メーター (全モード共通表示) -->
    <div class="meters" id="meterContainer"></div>
  </div>

  <!-- シークバー -->
  <div class="seek-area">
    <input type="range" id="seekBar" min="0" max="100" value="0" disabled>
  </div>

  <!-- 操作ボタン -->
  <div class="controls-row">
    <button class="ctrl-btn" id="btnPlay" disabled>PLAY</button>
    <button class="ctrl-btn" id="btnPause" disabled>PAUSE</button>
    <button class="ctrl-btn" id="btnStop" disabled>STOP</button>
  </div>

  <!-- 音量調整 -->
  <div class="vol-area">
    <label>VOLUME:</label>
    <input type="range" id="volBar" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<script>
let currentMode = '8bit';
let audioCtx, masterGain, parsedMidi = null;
let isPlaying = false, isPaused = false, pauseOffset = 0, startTime = 0;
let activeNodes = [], animFrameId = null;
const chFills = [];

// メーター初期化 (16ch)
const meterContainer = document.getElementById('meterContainer');
for(let i = 0; i < 16; i++) {
  const bar = document.createElement('div'); bar.className = 'meter-bar';
  const fill = document.createElement('div'); fill.className = 'meter-fill';
  bar.appendChild(fill); meterContainer.appendChild(bar);
  chFills.push(fill);
}

const fileInput = document.getElementById('fileInput');
const btnPlay = document.getElementById('btnPlay');
const btnPause = document.getElementById('btnPause');
const btnStop = document.getElementById('btnStop');
const seekBar = document.getElementById('seekBar');
const volBar = document.getElementById('volBar');
const timeDisplay = document.getElementById('timeDisplay');
const statusText = document.getElementById('statusText');

// テーマ切り替え
function switchTheme(mode) {
  currentMode = mode;
  document.body.className = `theme-${mode}`;
  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', ['8bit', 'ms', 'xg', 'sc88'][idx] === mode);
  });
  
  // モード変更時に再生中の音色を即座に切り替えるため再スタート
  if (isPlaying) {
    play(audioCtx.currentTime - startTime);
  }
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = volBar.value;
    masterGain.connect(audioCtx.destination);
  }
}

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const arrayBuffer = await file.arrayBuffer();
  parsedMidi = new Midi(arrayBuffer);
  btnPlay.disabled = false;
  seekBar.disabled = false;
  statusText.textContent = `LOADED: ${file.name}`;
  stop();
  updateTimeDisplay(0, parsedMidi.duration);
});

volBar.addEventListener('input', () => { if (masterGain) masterGain.gain.value = volBar.value; });
btnPlay.addEventListener('click', () => { initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume(); isPaused ? resume() : play(pauseOffset); });
btnPause.addEventListener('click', pause);
btnStop.addEventListener('click', stop);

seekBar.addEventListener('input', () => {
  if (!parsedMidi) return;
  const targetTime = (seekBar.value / 100) * parsedMidi.duration;
  pauseOffset = targetTime;
  if (isPlaying) { stopNodes(); play(targetTime); }
  else { updateTimeDisplay(targetTime, parsedMidi.duration); }
});

// 音源モード別のノード生成ロジック
function createNoteNode(note, now, noteStart, noteDuration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const freq = 440 * Math.pow(2, (note.midi - 69) / 12);

  if (currentMode === '8bit') {
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, now + noteStart);
    gain.gain.exponentialRampToValueAtTime(0.001, now + noteStart + noteDuration);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now + noteStart);
    osc.stop(now + noteStart + noteDuration);
    return [osc];
  } 
  else if (currentMode === 'ms') {
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    gain.gain.setValueAtTime(0.1, now + noteStart);
    gain.gain.exponentialRampToValueAtTime(0.001, now + noteStart + noteDuration);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    osc.start(now + noteStart);
    osc.stop(now + noteStart + noteDuration);
    return [osc];
  }
  else if (currentMode === 'xg') {
    const osc2 = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc2.type = 'square';
    osc.frequency.value = freq;
    osc2.frequency.value = freq * 1.001; // デチューン
    filter.type = 'lowpass';
    filter.frequency.value = 2500;
    gain.gain.setValueAtTime(0.08, now + noteStart);
    gain.gain.exponentialRampToValueAtTime(0.001, now + noteStart + noteDuration);
    osc.connect(filter); osc2.connect(filter);
    filter.connect(gain); gain.connect(masterGain);
    osc.start(now + noteStart); osc.stop(now + noteStart + noteDuration);
    osc2.start(now + noteStart); osc2.stop(now + noteStart + noteDuration);
    return [osc, osc2];
  }
  else { // SC-88
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = 1800;
    gain.gain.setValueAtTime(0.12, now + noteStart);
    gain.gain.exponentialRampToValueAtTime(0.001, now + noteStart + noteDuration);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    osc.start(now + noteStart);
    osc.stop(now + noteStart + noteDuration);
    return [osc];
  }
}

function play(startFrom = 0) {
  if (!parsedMidi) return;
  stopNodes();
  isPlaying = true; isPaused = false;
  startTime = audioCtx.currentTime - startFrom;
  btnPlay.disabled = true; btnPause.disabled = false; btnStop.disabled = false;
  statusText.textContent = `PLAYING [${currentMode.toUpperCase()}]`;

  const now = audioCtx.currentTime;
  parsedMidi.tracks.forEach((track, trkIdx) => {
    const ch = trkIdx % 16;
    track.notes.forEach(note => {
      if (note.time + note.duration < startFrom) return;
      const noteStart = Math.max(0, note.time - startFrom);
      const noteDuration = note.time < startFrom ? (note.time + note.duration - startFrom) : note.duration;

      const nodes = createNoteNode(note, now, noteStart, noteDuration);
      nodes.forEach(osc => {
        activeNodes.push({ osc, ch, time: note.time, duration: note.duration });
      });
    });
  });
  updateLoop();
}

function pause() {
  if (!isPlaying) return;
  pauseOffset = audioCtx.currentTime - startTime;
  stopNodes(); isPlaying = false; isPaused = true;
  btnPlay.disabled = false; btnPause.disabled = true;
  statusText.textContent = "PAUSED";
  resetMeters();
  cancelAnimationFrame(animFrameId);
}

function resume() { play(pauseOffset); }

function stop() {
  stopNodes(); isPlaying = false; isPaused = false; pauseOffset = 0;
  btnPlay.disabled = !parsedMidi; btnPause.disabled = true; btnStop.disabled = true;
  seekBar.value = 0; statusText.textContent = parsedMidi ? "STOPPED" : "SYSTEM READY";
  resetMeters();
  cancelAnimationFrame(animFrameId);
  if (parsedMidi) updateTimeDisplay(0, parsedMidi.duration);
}

function stopNodes() {
  activeNodes.forEach(n => { try { n.osc.stop(); } catch(e){} });
  activeNodes = [];
}

function resetMeters() {
  chFills.forEach(f => f.style.height = '0%');
}

function updateLoop() {
  if (!isPlaying || !parsedMidi) return;
  const current = audioCtx.currentTime - startTime;
  const duration = parsedMidi.duration;

  if (current >= duration) { stop(); return; }

  seekBar.value = (current / duration) * 100;
  updateTimeDisplay(current, duration);

  // Meter Animation
  const activeChs = new Array(16).fill(0);
  activeNodes.forEach(n => {
    if (current >= n.time && current <= n.time + n.duration) {
      activeChs[n.ch] = Math.min(100, activeChs[n.ch] + 35);
    }
  });
  chFills.forEach((fill, i) => {
    fill.style.height = `${activeChs[i]}%`;
  });

  animFrameId = requestAnimationFrame(updateLoop);
}

function updateTimeDisplay(current, duration) {
  const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
  timeDisplay.textContent = `${fmt(current)} / ${fmt(duration)}`;
}
</script>
</body>
</html>
