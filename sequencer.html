<div style="
  background: #18181b;
  color: #f4f4f5;
  font-family: 'Segoe UI', sans-serif;
  border: 2px solid #3f3f46;
  border-radius: 12px;
  padding: 16px;
  width: 100%;
  max-width: 100%;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  box-sizing: border-box;
">
  <!-- ヘッダー & コントロール -->
  <div style="display: flex; gap: 10px; margin-bottom: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="playBtn" onclick="togglePlay()" style="background: #22c55e; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-weight: bold; cursor: pointer; font-size: 0.9rem;">▶ PLAY</button>
      <button onclick="clearGrid()" style="background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 0.85rem;">クリア</button>
    </div>

    <div style="display: flex; gap: 12px; align-items: center;">
      <label style="font-size: 0.85rem; font-weight: bold;">BPM: <span id="bpmVal" style="color: #4ade80;">120</span></label>
      <input type="range" id="bpmSlider" min="60" max="180" value="120" oninput="updateBPM(this.value)" style="cursor: pointer;">
    </div>
  </div>

  <!-- シーケンサーグリッド (16ステップ) -->
  <div style="overflow-x: auto; padding-bottom: 8px;">
    <div id="sequencerGrid" style="display: flex; flex-direction: column; gap: 6px; min-width: 520px;">
      <!-- JSで動的生成 -->
    </div>
  </div>

  <!-- 保存機能 -->
  <div style="margin-top: 12px; border-top: 1px solid #3f3f46; padding-top: 10px; display: flex; gap: 8px; align-items: center;">
    <span style="font-size: 0.8rem; color: #a1a1aa; font-weight: bold;">💾 パターン保存:</span>
    <button onclick="savePattern()" style="background: #3b82f6; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; font-weight: bold;">保存</button>
    <button onclick="loadPattern()" style="background: #eab308; color: #000; border: none; border-radius: 4px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; font-weight: bold;">呼び出し</button>
  </div>
</div>

<script>
let audioCtx = null;
let isPlaying = false;
let currentStep = 0;
let timerId = null;
let bpm = 120;

// 音色の定義（ドラム3種 + ベース3音）
const tracks = [
  { name: 'KICK', type: 'drum', pitch: 'kick', color: '#ef4444' },
  { name: 'SNARE', type: 'drum', pitch: 'snare', color: '#f97316' },
  { name: 'HI-HAT', type: 'drum', pitch: 'hihat', color: '#eab308' },
  { name: 'BASS High', type: 'synth', freq: 220, color: '#3b82f6' },
  { name: 'BASS Mid', type: 'synth', freq: 164.81, color: '#8b5cf6' },
  { name: 'BASS Low', type: 'synth', freq: 110, color: '#ec4899' }
];

// グリッド状態 (6トラック × 16ステップ)
let gridData = Array(tracks.length).fill().map(() => Array(16).fill(false));

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// UIの構築
const gridEl = document.getElementById('sequencerGrid');
tracks.forEach((track, trkIdx) => {
  const row = document.createElement('div');
  row.style.cssText = "display: flex; gap: 4px; align-items: center;";

  const label = document.createElement('div');
  label.style.cssText = `width: 90px; font-size: 0.75rem; font-weight: bold; color: ${track.color}; text-align: right; padding-right: 8px; flex-shrink: 0;`;
  label.innerText = track.name;
  row.appendChild(label);

  for (let step = 0; step < 16; step++) {
    const cell = document.createElement('div');
    cell.id = `cell-${trkIdx}-${step}`;
    cell.style.cssText = `
      flex: 1; height: 28px; background: #27272a; border-radius: 4px; cursor: pointer;
      border: 1px solid #3f3f46; transition: background 0.1s;
      ${step % 4 === 0 ? 'border-left: 2px solid #71717a;' : ''}
    `;
    cell.onclick = () => toggleCell(trkIdx, step);
    row.appendChild(cell);
  }
  gridEl.appendChild(row);
});

function toggleCell(trkIdx, step) {
  gridData[trkIdx][step] = !gridData[trkIdx][step];
  renderGrid();
}

function renderGrid() {
  tracks.forEach((track, trkIdx) => {
    for (let step = 0; step < 16; step++) {
      const cell = document.getElementById(`cell-${trkIdx}-${step}`);
      const isActive = gridData[trkIdx][step];
      const isCurrent = step === currentStep && isPlaying;

      if (isActive) {
        cell.style.background = isCurrent ? '#ffffff' : track.color;
      } else {
        cell.style.background = isCurrent ? '#3f3f46' : '#27272a';
      }
    }
  });
}

function playSound(track, time) {
  if (track.type === 'drum') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (track.pitch === 'kick') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, time);
      osc.frequency.exponentialRampToValueAtTime(30, time + 0.1);
      gain.gain.setValueAtTime(0.8, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
    } else if (track.pitch === 'snare') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, time);
      gain.gain.setValueAtTime(0.5, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
    } else { // hihat
      osc.type = 'square';
      osc.frequency.setValueAtTime(6000, time);
      gain.gain.setValueAtTime(0.2, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
    }

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.12);
  } else {
    // 8bitファミコン風の矩形波ベース
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    osc.frequency.setValueAtTime(track.freq, time);

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(0.2, time + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.18);
  }
}

function stepLoop() {
  const time = audioCtx.currentTime;
  tracks.forEach((track, trkIdx) => {
    if (gridData[trkIdx][currentStep]) {
      playSound(track, time);
    }
  });

  renderGrid();
  currentStep = (currentStep + 1) % 16;
}

function togglePlay() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');

  if (isPlaying) {
    btn.innerText = "■ STOP";
    btn.style.background = "#ef4444";
    currentStep = 0;
    const interval = (60 / bpm / 4) * 1000;
    stepLoop();
    timerId = setInterval(stepLoop, interval);
  } else {
    btn.innerText = "▶ PLAY";
    btn.style.background = "#22c55e";
    clearInterval(timerId);
    renderGrid();
  }
}

function updateBPM(val) {
  bpm = val;
  document.getElementById('bpmVal').innerText = val;
  if (isPlaying) {
    clearInterval(timerId);
    const interval = (60 / bpm / 4) * 1000;
    timerId = setInterval(stepLoop, interval);
  }
}

function clearGrid() {
  gridData = Array(tracks.length).fill().map(() => Array(16).fill(false));
  renderGrid();
}

function savePattern() {
  localStorage.setItem('seq_pattern', JSON.stringify(gridData));
  alert('パターンを保存したよ！');
}

function loadPattern() {
  const saved = localStorage.getItem('seq_pattern');
  if (saved) {
    gridData = JSON.parse(saved);
    renderGrid();
  } else {
    alert('保存されたパターンがないよ！');
  }
}
</script>
