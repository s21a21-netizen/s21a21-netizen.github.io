<div style="
  background: #f1f5f9;
  font-family: 'Segoe UI', sans-serif;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  padding: 16px;
  width: 100%;
  max-width: 100%;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  box-sizing: border-box;
  color: #1e293b;
">
  <!-- ブラウザツールバー（ボタンと入力欄を大きめに設定） -->
  <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
    <button onclick="goBack()" style="background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 1rem; font-weight: bold;">◀</button>
    <button onclick="reloadFrame()" style="background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 1rem; font-weight: bold;">↻</button>
    
    <input type="text" id="webUrl" value="https://example.com" style="flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;" onkeydown="if(event.key==='Enter') navigate()">
    
    <button onclick="navigate()" style="background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 10px 18px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">Go</button>
    <button onclick="saveBookmark()" style="background: #f59e0b; color: #fff; border: none; border-radius: 6px; padding: 10px 14px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">★ 追加</button>
  </div>

  <!-- メイン表示領域（高さを500pxに大幅アップ！） -->
  <iframe id="browserFrame" src="https://example.com" style="width: 100%; height: 500px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;"></iframe>

  <!-- データ保存エリア（お気に入り & 履歴） -->
  <div style="margin-top: 14px; display: flex; gap: 12px; font-size: 0.85rem;">
    <!-- ブックマーク一覧 -->
    <div style="flex: 1; background: #fff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 6px;">
      <div style="font-weight: bold; color: #475569; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 0.9rem;">
        <span>★ お気に入り</span>
        <span onclick="clearBookmarks()" style="color: #ef4444; cursor: pointer; font-weight: normal; font-size: 0.8rem;">削除</span>
      </div>
      <div id="bookmarkList" style="max-height: 90px; overflow-y: auto;"></div>
    </div>

    <!-- 履歴一覧 -->
    <div style="flex: 1; background: #fff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 6px;">
      <div style="font-weight: bold; color: #475569; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 0.9rem;">
        <span>🕒 閲覧履歴</span>
        <span onclick="clearHistory()" style="color: #ef4444; cursor: pointer; font-weight: normal; font-size: 0.8rem;">削除</span>
      </div>
      <div id="historyList" style="max-height: 90px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<script>
function navigate() {
  let url = document.getElementById('webUrl').value.trim();
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
    document.getElementById('webUrl').value = url;
  }
  document.getElementById('browserFrame').src = url;

  let history = JSON.parse(localStorage.getItem('web_history') || '[]');
  if (!history.includes(url)) {
    history.unshift(url);
    if (history.length > 10) history.pop();
    localStorage.setItem('web_history', JSON.stringify(history));
    loadSavedData();
  }
}

function reloadFrame() {
  const frame = document.getElementById('browserFrame');
  frame.src = frame.src;
}

function goBack() {
  window.history.back();
}

function saveBookmark() {
  const url = document.getElementById('webUrl').value.trim();
  let bookmarks = JSON.parse(localStorage.getItem('web_bookmarks') || '[]');
  
  if (!bookmarks.includes(url)) {
    bookmarks.push(url);
    localStorage.setItem('web_bookmarks', JSON.stringify(bookmarks));
    loadSavedData();
  }
}

function loadSavedData() {
  const bmList = document.getElementById('bookmarkList');
  const bookmarks = JSON.parse(localStorage.getItem('web_bookmarks') || '[]');
  bmList.innerHTML = bookmarks.length ? '' : '<span style="color:#94a3b8;">なし</span>';
  bookmarks.forEach(url => {
    const item = document.createElement('div');
    item.style.cssText = "white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #2563eb; padding: 2px 0;";
    item.innerText = url;
    item.onclick = () => { document.getElementById('webUrl').value = url; navigate(); };
    bmList.appendChild(item);
  });

  const hsList = document.getElementById('historyList');
  const history = JSON.parse(localStorage.getItem('web_history') || '[]');
  hsList.innerHTML = history.length ? '' : '<span style="color:#94a3b8;">なし</span>';
  history.forEach(url => {
    const item = document.createElement('div');
    item.style.cssText = "white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #475569; padding: 2px 0;";
    item.innerText = url;
    item.onclick = () => { document.getElementById('webUrl').value = url; navigate(); };
    hsList.appendChild(item);
  });
}

function clearBookmarks() {
  localStorage.removeItem('web_bookmarks');
  loadSavedData();
}

function clearHistory() {
  localStorage.removeItem('web_history');
  loadSavedData();
}

loadSavedData();
</script>
