<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI 画像生成</title>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #18181b;
      border: 4px solid #3f3f46;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      text-align: center;
    }
    h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #a855f7; }
    p { font-size: 0.8rem; color: #a1a1aa; margin-bottom: 15px; }
    
    input, textarea, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #52525b;
      background: #27272a;
      color: #fff;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      background: #a855f7;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 5px;
    }
    button:hover { background: #9333ea; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .image-box {
      background: #09090b;
      border: 2px dashed #3f3f46;
      border-radius: 8px;
      min-height: 256px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
      overflow: hidden;
    }
    .image-box img { max-width: 100%; height: auto; border-radius: 6px; display: none; }
    #statusMsg { font-size: 0.85rem; margin-top: 10px; height: 1.2em; color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <h2>✨ Gemini 画像生成</h2>
  <p>Gemini (Imagen 3) を使って画像を生成するよ！</p>

  <!-- APIキー入力欄（ローカルストレージに保持） -->
  <input type="password" id="apiKeyInput" placeholder="Google AI Studio の API キーを入力">
  
  <!-- プロンプト入力欄 -->
  <textarea id="promptInput" rows="3" placeholder="生成したい画像のイメージ（例: A cute pixel art cat in space）"></textarea>

  <button type="button" id="generateBtn" onclick="generateImage()">画像を生成 🚀</button>

  <div id="statusMsg"></div>

  <div class="image-box">
    <img id="resultImage" alt="生成された画像">
    <span id="placeholderText" style="color: #71717a; font-size: 0.85rem;">ここに画像が表示されます</span>
  </div>
</div>

<script>
// ページ読み込み時に保存されたAPIキーを復元
window.onload = () => {
  const savedKey = localStorage.getItem('gemini_api_key');
  if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
};

async function generateImage() {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const prompt = document.getElementById('promptInput').value.trim();
  const statusMsg = document.getElementById('statusMsg');
  const resultImg = document.getElementById('resultImage');
  const placeholder = document.getElementById('placeholderText');
  const btn = document.getElementById('generateBtn');

  if (!apiKey) {
    alert("APIキーを入力してください！");
    return;
  }
  if (!prompt) {
    alert("プロンプト（説明文）を入力してください！");
    return;
  }

  // APIキーをブラウザに保存（次回入力を省くため）
  localStorage.setItem('gemini_api_key', apiKey);

  // UIを生成中表示にセット
  statusMsg.innerText = "🎨 Geminiが画像を生成中...";
  statusMsg.style.color = "#38bdf8";
  btn.disabled = true;
  placeholder.innerText = "生成中...";
  placeholder.style.display = "block";
  resultImg.style.display = "none";

  try {
    // Imagen 3 API リクエスト
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:generateImages?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: prompt,
        config: {
          numberOfImages: 1,
          outputMimeType: "image/jpeg",
          aspectRatio: "1:1"
        }
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "画像の生成に失敗しました");
    }

    // Base64画像データを表示
    const base64Image = data.generatedImages[0].image.imageBytes;
    resultImg.src = `data:image/jpeg;base64,${base64Image}`;
    resultImg.style.display = "block";
    placeholder.style.display = "none";
    statusMsg.innerText = "🎉 画像の生成が完了したよ！";
    statusMsg.style.color = "#4ade80";

  } catch (error) {
    console.error(error);
    statusMsg.innerText = "❌ エラー: " + error.message;
    statusMsg.style.color = "#f87171";
    placeholder.innerText = "エラーが発生しました";
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
