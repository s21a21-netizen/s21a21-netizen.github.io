<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI 画像生成</title>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #18181b;
      border: 4px solid #3f3f46;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      text-align: center;
    }
    h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #a855f7; }
    p { font-size: 0.8rem; color: #a1a1aa; margin-bottom: 15px; }
    
    textarea, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #52525b;
      background: #27272a;
      color: #fff;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      background: #a855f7;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 5px;
    }
    button:hover { background: #9333ea; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .image-box {
      background: #09090b;
      border: 2px dashed #3f3f46;
      border-radius: 8px;
      min-height: 256px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
      overflow: hidden;
    }
    .image-box img { max-width: 100%; height: auto; border-radius: 6px; display: none; }
    #statusMsg { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; color: #38bdf8; word-break: break-all; }
  </style>
</head>
<body>

<div class="container">
  <h2>✨ Gemini 画像生成</h2>
  <p>作りたい画像のイメージを入力してね！</p>

  <!-- プロンプト入力欄 -->
  <textarea id="promptInput" rows="3" placeholder="生成したい画像のイメージ（例: A cute pixel art cat in space）"></textarea>

  <button type="button" id="generateBtn" onclick="generateImage()">画像を生成 🚀</button>

  <div id="statusMsg"></div>

  <div class="image-box">
    <img id="resultImage" alt="生成された画像">
    <span id="placeholderText" style="color: #71717a; font-size: 0.85rem;">ここに画像が表示されます</span>
  </div>
</div>

<script>
// 新しいGASのURLを設定済み
const GAS_URL = "https://script.google.com/macros/s/AKfycbzR7V__iATFNWYuCTVxqUW58ctUi7Vw-RaGOiQCJriiZDfJcGTU2ddhs9Am5ykZc7cF/exec";

async function generateImage() {
  const prompt = document.getElementById('promptInput').value.trim();
  const statusMsg = document.getElementById('statusMsg');
  const resultImg = document.getElementById('resultImage');
  const placeholder = document.getElementById('placeholderText');
  const btn = document.getElementById('generateBtn');

  if (!prompt) {
    alert("プロンプト（説明文）を入力してください！");
    return;
  }

  statusMsg.innerText = "🎨 Geminiが画像を生成中...";
  statusMsg.style.color = "#38bdf8";
  btn.disabled = true;
  placeholder.innerText = "生成中...";
  placeholder.style.display = "block";
  resultImg.style.display = "none";

  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ prompt: prompt })
    });

    const data = await response.json();

    if (data.error) {
      const errorText = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
      throw new Error(errorText);
    }

    if (!data.generatedImages || !data.generatedImages[0]) {
      throw new Error("画像データが取得できませんでした。GAS側のAPIキー設定を確認してください。");
    }

    const base64Image = data.generatedImages[0].image.imageBytes;
    resultImg.src = `data:image/jpeg;base64,${base64Image}`;
    resultImg.style.display = "block";
    placeholder.style.display = "none";
    statusMsg.innerText = "🎉 画像の生成が完了したよ！";
    statusMsg.style.color = "#4ade80";

  } catch (error) {
    console.error(error);
    statusMsg.innerText = "❌ エラー: " + error.message;
    statusMsg.style.color = "#f87171";
    placeholder.innerText = "エラーが発生しました";
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
